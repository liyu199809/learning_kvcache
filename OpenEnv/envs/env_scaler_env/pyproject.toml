[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "env-scaler-openenv"
version = "0.1.0"
description = "OpenEnv service for official EnvScaler executable environments"
requires-python = ">=3.10"
dependencies = [
    "openenv>=0.2.2",
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.24.0",
    "huggingface-hub>=0.20.0",
    "jsonschema>=4.0.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3", "pytest-asyncio>=0.23.0"]

[project.scripts]
server = "env_scaler_env.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["env_scaler_env", "env_scaler_env.server"]

[tool.setuptools.package-dir]
"env_scaler_env" = "."
"env_scaler_env.server" = "server"
